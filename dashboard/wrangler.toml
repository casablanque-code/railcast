name = "railcast-dashboard"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "app.railcast.casablanque.com", custom_domain = true }
]

[assets]
directory = "./out"
# All routes here are static, prerendered pages (no client-side router) —
# a real 404.html exists in the export, so use it instead of SPA fallback.
not_found_handling = "404-page"
