name = "railcast-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "railcast.casablanque.com", custom_domain = true }
]

[assets]
# Built by `dashboard`: cd dashboard && npm ci && npm run build.
# Path is relative to this file, not the process cwd.
directory = "../dashboard/out"
not_found_handling = "404-page"
# Without this, browser navigation requests (Sec-Fetch-Mode: navigate — e.g.
# clicking the magic-link in an email, or opening an appcast.xml link in a
# new tab) that don't match a static file get served the 404 page directly
# and never reach the Worker script at all — that's the default since our
# compatibility_date is past 2025-04-01. fetch()-based requests (the
# dashboard's own API calls) were never affected, only real page loads.
run_worker_first = [
  "/auth/*",
  "/api/*",
  "/logout",
  "/*/appcast.xml",
  "/*/upload/*",
  "/*/versions"
]

[[d1_databases]]
binding = "DB"
database_name = "railcast"
database_id = "c6c4b8eb-8196-4202-b3c3-c48e4606f71b"

[[r2_buckets]]
binding = "BUILDS"
bucket_name = "railcast-builds"

[vars]
PUBLIC_FILE_BASE_URL = "https://dl.railcast.casablanque.com"
