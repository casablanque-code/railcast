name = "railcast-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "railcast.casablanque.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "railcast"
database_id = "6dc08ee1-4aa6-42db-92de-d4b78baf1556"

[[r2_buckets]]
binding = "BUILDS"
bucket_name = "railcast-builds"

[vars]
PUBLIC_FILE_BASE_URL = "https://dl.railcast.casablanque.com"
# Origin of the Next.js dashboard (Cloudflare Pages) — used for CORS and the
# post-login redirect. Update if you deploy the dashboard elsewhere.
CORS_ORIGIN = "https://app.railcast.casablanque.com"
