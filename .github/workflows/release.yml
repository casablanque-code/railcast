name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      # A current toolchain, not the go.mod minimum: Go 1.22 links darwin
      # binaries without LC_UUID, and current macOS refuses to run those
      # ("dyld: missing LC_UUID load command"). The check below keeps it honest.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build binary
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="railcast-${{ github.ref_name }}-${GOOS}-${GOARCH}"
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$out" .
          shasum -a 256 "$out" > "$out.sha256"

      - name: Check macOS binaries can be loaded (LC_UUID)
        if: matrix.goos == 'darwin'
        run: python3 .github/scripts/check-macho-uuid.py "cli/railcast-${{ github.ref_name }}-darwin-${{ matrix.goarch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: railcast-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cli/railcast-*
            !cli/railcast-*.go
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
